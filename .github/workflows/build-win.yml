name: Build Dictol Windows Portable
run-name: Build Dictol Windows Portable x64
on:
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-2022
    env:
      ELECTRON_BUILDER_CACHE: C:\TEMP\electron-builder-cache
      CARGO_TARGET_DIR: ./crates/target
      CARGO_PROFILE_RELEASE_DEBUG: false # 关闭调试符号，加速Rust编译，减小包体积
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: default
          toolchain: stable
          override: true

      - name: Setup Node 22.15.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: 'npm'

      # Rust编译产物缓存
      - name: Cache Rust build artifacts
        id: rustcache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            crates
          key: "dictol-rust-windows"

      # 打印Rust缓存状态
      - name: Show Rust cache status
        run: |
          Write-Host "Cache hit? ${{ steps.rustcache.outputs.cache-hit }}"
          if("${{ steps.rustcache.outputs.cache-hit }}" -eq "true"){
            Write-Host "✅ Rust缓存命中，不会全量重编译Rust代码！"
          }else{
            Write-Host "❌ Rust缓存未命中，本次完整编译Rust原生模块"
          }

      # electron-builder缓存：缓存Electron本体、binaries
      - name: Cache Electron Builder binaries
        id: electron-builder-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: dictol-electron-builder-win-${{ hashFiles('package-lock.json') }}

      - name: Show Electron Builder cache status
        run: |
          Write-Host "Electron builder cache hit? ${{ steps.electron-builder-cache.outputs.cache-hit }}"
          if("${{ steps.electron-builder-cache.outputs.cache-hit }}" -eq "true"){
            Write-Host "✅ Electron缓存命中，无需重新下载Electron本体"
          }else{
            Write-Host "❌ Electron缓存未命中，本次下载Electron二进制包"
          }

      - name: Install dependencies & build native Rust module
        run: npm install --no-deprecation

      - name: Prepare electron-builder temp cache dir
        run: New-Item -ItemType Directory -Force -Path $env:ELECTRON_BUILDER_CACHE

      - name: Clean old build dirs
        run: |
          if(Test-Path dist) { Remove-Item dist -Recurse -Force }
          if(Test-Path release) { Remove-Item release -Recurse -Force }
          if(Test-Path build.log) { Remove-Item build.log }

      # =========关键改动=========
      # 调用项目总构建脚本npm run build：编译Rust + 打包前端，生成完整资源与mdict-native的.node原生模块
      # 不再调用build-win.mjs，避开里面adblock restore捕获逻辑
      - name: Run full project build (frontend + rust native module)
        run: npm run build *>> build.log
        shell: pwsh

      # 直接调用electron-builder打包portable便携exe
      - name: Build portable exe directly with electron-builder
        run: npx electron-builder --win portable *>> build.log
        shell: pwsh

      # 打印打包出来exe的文件大小
      - name: Print portable exe size
        run: |
          if(Test-Path release){
            $exeFiles = Get-ChildItem release/*.exe
            foreach ($f in $exeFiles) {
              $sizeMB = [math]::Round($f.Length / 1MB, 2)
              Write-Host "📦 产物文件: $($f.Name)"
              Write-Host "📦 文件大小: $sizeMB MB ($($f.Length) Bytes)"
            }
          }else{
            Write-Host "⚠️ release目录不存在，打包失败"
          }
        shell: pwsh

      # 无论成功失败，上传产物+日志
      - name: Upload Artifact (exe + build log)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dictol-Win-Portable-x64
          path: |
            release/*.exe
            build.log
