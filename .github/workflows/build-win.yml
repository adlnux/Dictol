name: Build Dictol Windows Portable
run-name: Build Dictol Windows Portable x64
on:
  workflow_dispatch: # 手动触发

jobs:
  build-windows-portable:
    runs-on: windows-2022
    env:
      ELECTRON_BUILDER_CACHE: C:\TEMP\electron-builder-cache
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: default
          toolchain: stable
          override: true

      - name: Setup Node 22.15.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: 'npm'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install dependencies & build native Rust module
        run: npm install --no-deprecation

      - name: Prepare electron-builder temp cache dir
        run: New-Item -ItemType Directory -Force -Path $env:ELECTRON_BUILDER_CACHE

      # 核心：直接调用electron-builder，仅打包win便携版，跳过NSIS安装包
      - name: Build Windows Portable exe
        run: npx electron-builder --win portable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictol-Win-Portable-x64
          path: release/*.exe
